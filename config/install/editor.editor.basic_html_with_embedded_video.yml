langcode: en
status: true
dependencies:
  config:
    - filter.format.basic_html_with_embedded_video
  module:
    - ckeditor
format: basic_html_with_embedded_video
editor: ckeditor
settings:
  toolbar:
    rows:
      -
        -
          name: Formatting
          items:
            - Bold
            - Italic
        -
          name: Links
          items:
            - DrupalLink
            - DrupalUnlink
        -
          name: Lists
          items:
            - BulletedList
            - NumberedList
        -
          name: Media
          items:
            - Blockquote
            - EmbedSemantic
        -
          name: 'Block formatting'
          items:
            - Format
        -
          name: Tools
          items:
            - Source
  plugins:
    language:
      language_list: un
    stylescombo:
      styles: ''
    autoembed:
      status: embedsemantic
    mentions:
      enable: false
      mentions_type: realname
      timeout: 500
      marker: '@'
      charcount: 3
      use_advanced_pattern: false
      pattern: ''
      advanced_pattern: ''
image_upload:
  status: false
  scheme: public
  directory: inline-images
  max_size: ''
  max_dimensions:
    width: null
    height: null
